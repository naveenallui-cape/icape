services:
  postgres:
    image: postgres:16-alpine
    container_name: icape-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: icape
      POSTGRES_PASSWORD: icape_secret
      POSTGRES_DB: icape
    volumes:
      - icape_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icape -d icape"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  icape_postgres_data:
